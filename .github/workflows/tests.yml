name: Java Selenium TestNG Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      # Do not use apt packages named chrome-driver or firefox-geckodriver:
      # those names are not available on ubuntu-latest.
      - name: Set up Chrome and ChromeDriver
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Set up Firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest

      - name: Set up GeckoDriver
        uses: browser-actions/setup-geckodriver@v1

      - name: Verify browsers and drivers
        run: |
          chrome --version || google-chrome --version
          chromedriver --version
          firefox --version
          geckodriver --version

      - name: Run tests headlessly
        run: mvn clean test -Dheadless=true

      - name: Generate Allure report
        if: always()
        run: mvn allure:report

      - name: Upload Allure report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: target/site/allure-maven-plugin
